---
# Decision Environment for EDA activations (Ascender-compatible fork project).
# Based on upstream ansible/ansible-rulebook minimal-decision-environment.yml,
# with versions pinned. Bump pins deliberately; smoke-test against Ascender.
version: 3

images:
  base_image:
    # Pinned by digest for supply-chain reproducibility (tag: latest as of
    # 2026-08-07; refresh the digest when deliberately bumping the base).
    name: "registry.access.redhat.com/ubi9/python-312-minimal@sha256:74c596c5d658fd82d226e84418b199640e5819b7b0475801ec5083b8d144aa0d"

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.12
  galaxy:
    collections:
      - name: ansible.eda
        version: 2.13.0
  python:
    - ansible-rulebook==1.3.2
  ansible_core:
    package_pip: ansible-core~=2.20.7
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  system:
    - java-17-openjdk-headless [platform:rpm]
    - python3.12-devel [compile platform:rpm]

additional_build_steps:
  append_final:
    # k8s runs activation pods with a random UID that can't write to the base
    # image's HOME (/opt/app-root/src); give ansible a writable home so
    # galaxy cache / collection listing work. /tmp is container-private
    # (single-process activation pod), so a world-writable base dir is
    # acceptable here.
    - ENV ANSIBLE_HOME=/tmp/.ansible ANSIBLE_LOCAL_TEMP=/tmp/.ansible/tmp HOME=/tmp
