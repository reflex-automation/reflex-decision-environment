name: reflex-build
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  schedule:
    - cron: '17 6 * * 1' # weekly rescan
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/reflex-automation/reflex-decision-environment

jobs:
  build-push:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-builder
        run: pipx install ansible-builder
      - name: Derive tag from ansible-rulebook pin
        run: echo "TAG=$(grep -oE 'ansible-rulebook==[0-9.]+' execution-environment.yml | cut -d= -f3)" >> "$GITHUB_ENV"
      - name: Build
        run: ansible-builder build --container-runtime docker --tag "$IMAGE:$TAG" -v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Push
        run: docker push "$IMAGE:$TAG"

  rescan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive tag from ansible-rulebook pin
        run: echo "TAG=$(grep -oE 'ansible-rulebook==[0-9.]+' execution-environment.yml | cut -d= -f3)" >> "$GITHUB_ENV"
      - name: Trivy scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
